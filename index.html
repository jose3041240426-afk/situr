<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f3049" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      El favicon es el ESCUDO del municipio, sin la palabra: es lo que
      aparece junto al nombre del sitio en la notificación de turno de
      Chrome de escritorio, y en la pestaña de la aplicación instalada.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS: sin esto, «Añadir a pantalla de inicio» abre una pestaña normal
         y Web Push no funciona (Safari solo lo permite en apps instaladas). -->
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SITUR" />
    <title>SITUR · Dirección de Catastro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
