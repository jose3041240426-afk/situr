<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon neutro de SITUR: sin monograma ni símbolo inventado.
       Solo el color institucional. Se reemplaza por el escudo del municipio
       cuando la dependencia lo entregue. -->
