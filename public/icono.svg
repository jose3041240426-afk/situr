  <rect x="16" y="20" width="32" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="16" y="29" width="22" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
  <rect x="16" y="38" width="14" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
</svg>
